# .github/workflows/version-preview.yml
name: version preview

on:
  pull_request:
    branches: [main, develop]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
         fetch-depth: 0
         ref: ${{ github.base_ref }}   # checkout main or develop, not the feature branch
      
      - name: configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"

      - name: merge pr commits for preview
        run: git merge --no-ff origin/${{ github.head_ref }} --no-edit
          
      - uses: astral-sh/setup-uv@v5
      - name: get version preview
        id: preview
        run: |
          OUTPUT=$(uv run semantic-release --noop version --print 2>&1)
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: post comment
        uses: actions/github-script@v7
        with:
          script: |
            const output = `**version preview**\n\`\`\`\n${{ steps.preview.outputs.output }}\n\`\`\``;
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.data.find(c => c.body.startsWith('**version preview**'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            }