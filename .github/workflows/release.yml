# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main, develop]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the version bump commit + tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history so PSR can read all commits
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and tag
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: ${{ github.workspace }}/pyproject.toml
